<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wiki</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--label:#f5f5f7;--l2:#a1a1a6;--l3:#86868b;--card:#1c1c1e;--fill:#7878805c;--fill3:#7676803d;--sep:#54545896;--accent:#0a84ff;
--gfill:rgb(255 255 255/0);--ghi:rgb(255 255 255/.6);--glo:rgb(0 0 0/.25);--gout:rgb(255 255 255/.18);--gsh:rgb(0 0 0/.4);--rim1:rgb(255 255 255/.8);--rim2:rgb(255 255 255/.04);
--gvol:inset 0 10px 16px -12px rgb(255 255 255/.30),inset 0 -12px 18px -12px rgb(0 0 0/.30),inset 8px 8px 16px -14px rgb(255 255 255/.22),inset -8px -8px 16px -14px rgb(255 255 255/.10),0 14px 34px -8px rgb(0 0 0/.38);
--gvol-s:inset 0 5px 8px -6px rgb(255 255 255/.30),inset 0 -6px 8px -6px rgb(0 0 0/.28),inset 4px 4px 9px -7px rgb(255 255 255/.20);
--spring:linear(0,.0345,.1146,.2153,.3212,.4233,.517,.5999,.6716,.7326,.7836,.8258,.8605,.8887,.9116,.93,.9447,.9564,.9658,.9732,.979,.9836,.9872,.99,.9923,.994,.9953,.9964,.9972,.9978,.9983,.9987,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#000;color:var(--label);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;letter-spacing:-.022em;padding-top:env(safe-area-inset-top);overflow-x:hidden}
@keyframes flow{from{background-position:0% 0}to{background-position:100% 0}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes glassIn{from{opacity:0;transform:translateY(40px) scale(.94);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes swapIn{from{opacity:0;transform:scale(.96) translateX(24px)}to{opacity:1;transform:none}}
@keyframes swapBack{from{opacity:0;transform:scale(.96) translateX(-24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes mat{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
/* ----- функциональный слой: стекло только у панелей и кнопок ----- */
.glass{position:fixed;z-index:20;isolation:isolate;background:var(--gfill);-webkit-backdrop-filter:saturate(1.15);backdrop-filter:saturate(1.15);
box-shadow:var(--gvol);animation:glassIn .7s var(--spring) both}
.glass{text-shadow:0 1px 6px rgb(0 0 0/.45)}
.glass::before{content:"";position:absolute;z-index:-1;pointer-events:none;top:6px;left:7%;width:26%;height:2px;border-radius:2px;background:linear-gradient(90deg,rgb(255 255 255/.95),rgb(255 255 255/0))}
.glass::after{content:"";position:absolute;z-index:-1;pointer-events:none;left:3.5%;right:3.5%;top:3px;height:44%;border-radius:26px 26px 60% 60%/26px 26px 100% 100%;background:linear-gradient(180deg,rgb(255 255 255/.34) 0,rgb(255 255 255/.10) 55%,rgb(255 255 255/0) 100%)}
@keyframes glint{0%{transform:translateX(0);opacity:0}6%{opacity:1}28%{transform:translateX(260%);opacity:0}100%{transform:translateX(260%);opacity:0}}
.dock::before{animation:glint 7s ease-in-out 1s infinite;will-change:transform,opacity}
body.scr .ring,body.scr .rp{animation-play-state:paused}
.dock{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:30px;padding:10px;display:grid;gap:8px}
.srch{display:block;width:100%;height:44px;border:0;border-radius:999px;padding:0 16px;background:rgb(255 255 255/.05);box-shadow:var(--gvol-s);color:var(--label);font:inherit;outline:0;transition:box-shadow .3s,background .3s}
.srch::placeholder{color:var(--l3)}.srch:focus{background:rgb(255 255 255/.07);box-shadow:var(--gvol-s),inset 0 0 22px rgb(255 255 255/.14)}
.tabs{display:flex;align-items:center;gap:8px;min-width:0}
.mbtn{flex:none;width:44px;height:36px;border:0;border-radius:999px;background:rgb(255 255 255/0);box-shadow:var(--gvol-s);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;transition:transform .49s var(--spring)}
.mbtn:active{transform:scale(.9)}.mbtn i{display:block;width:18px;height:2px;border-radius:2px;background:var(--label)}
.chips{position:relative;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}.chips::-webkit-scrollbar{display:none}
.chip{position:relative;z-index:1;flex:none;height:36px;padding:0 14px;display:grid;place-items:center;border-radius:999px;color:var(--l2);font-size:15px;font-weight:500;cursor:pointer;transition:color .3s;white-space:nowrap}
.chip.on{color:var(--label);font-weight:600}.chip:active{transform:scale(.94)}
.pill{position:absolute;left:0;top:0;height:36px;border-radius:999px;background:rgb(255 255 255/.05);transition:transform .49s var(--spring),width .49s var(--spring);box-shadow:var(--gvol-s);will-change:transform,width}
.sheet{position:fixed;inset:0;z-index:40}.scrim{position:absolute;inset:0;background:#0009}
.sbox{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto;padding:8px;border-radius:30px}
.si{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:18px;color:var(--label);font-size:17px;cursor:pointer}.si.on{background:rgb(255 255 255/.05);box-shadow:var(--gvol-s)}.si:active{background:rgb(255 255 255/.04)}
.gbtn{position:relative;isolation:isolate;overflow:hidden;border:0;color:var(--label);font:inherit;font-weight:600;min-height:44px;padding:0 20px;border-radius:999px;background:var(--gfill);-webkit-backdrop-filter:saturate(1.15);backdrop-filter:saturate(1.15);
box-shadow:var(--gvol-s),0 8px 20px -6px rgb(0 0 0/.4);transition:transform .49s var(--spring),box-shadow .4s}
.gbtn::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--px,50%) var(--py,50%),rgb(255 255 255/.45),transparent 65%);transition:opacity .24s}
.gbtn::after{content:"";position:absolute;z-index:-1;pointer-events:none;inset:2px 7% auto 7%;height:46%;border-radius:999px;background:linear-gradient(90deg,rgb(255 255 255/.95),rgb(255 255 255/0)) 12% 4px/30% 2px no-repeat,linear-gradient(180deg,rgb(255 255 255/.34),rgb(255 255 255/.06) 60%,rgb(255 255 255/0))}
.gbtn:active{transform:scale(.94)}.gbtn:active::before{opacity:1}
.gbtn.pri{background:rgb(10 132 255/.55);color:#fff;box-shadow:var(--gvol-s),inset 0 0 18px rgb(10 132 255/.35),0 8px 22px -6px #0a84ff80}
.fab{top:calc(env(safe-area-inset-top) + 10px);right:12px;display:flex;gap:8px;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}.fab::after,.fab::before{display:none}
.bar{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:30px;padding:10px 14px;display:grid;gap:4px}
.bar label{margin:0;min-height:40px;display:flex;justify-content:space-between;align-items:center;color:var(--label);font-size:16px;letter-spacing:-.02em}
.bar input{width:auto;height:auto}.bar .gbtn{width:100%;margin-top:4px}
.edge{position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 16px);z-index:10;pointer-events:none;-webkit-backdrop-filter:blur(6px) saturate(150%);backdrop-filter:blur(6px) saturate(150%);background:linear-gradient(#0003,#0000);-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
/* ----- слой контента ----- */
h1{margin:6px 20px 14px;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em}h1 small{display:block;font-size:15px;font-weight:400;color:var(--l2);margin-top:2px;letter-spacing:-.01em}
.list{margin:0 16px;padding:0 0 200px}.grp{background:rgb(255 255 255/.03);box-shadow:var(--gvol-s);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:9px 14px 9px 10px;cursor:pointer;position:relative;transition:background .25s,transform .49s var(--spring);animation:rise .6s var(--spring) both;animation-delay:calc(var(--i,0) * 30ms)}
.row:active{background:var(--fill3);transform:scale(.985)}.row+.row::before{content:"";position:absolute;top:0;left:78px;right:0;height:.5px;background:var(--sep)}
.ring{flex:none;padding:2px;border-radius:17px;background:linear-gradient(120deg,var(--c1),var(--c2),var(--c3),var(--c2),var(--c1));background-size:300% 100%;animation:flow 6s linear infinite}
.th{width:54px;height:54px;flex:none;border-radius:15px;overflow:hidden;position:relative;isolation:isolate;perspective:500px;background:transparent}
.th .grad{position:absolute;inset:0;z-index:0;overflow:hidden;border-radius:inherit;background:linear-gradient(180deg,var(--c2) 0%,var(--c1) 38%,var(--c3) 100%)}
.th .grad::before{content:"";position:absolute;inset:-12% -20%;background:repeating-linear-gradient(90deg,transparent 0 9%,rgb(255 255 255/.24) 13%,transparent 19%),radial-gradient(60% 55% at 50% 0%,var(--c2),transparent 75%);mix-blend-mode:screen;opacity:.85;animation:sway 4.2s ease-in-out infinite;will-change:transform}
@keyframes sway{0%,100%{transform:translate3d(-6%,0,0)}50%{transform:translate3d(6%,0,0)}}
.th .gl{position:absolute;inset:0;z-index:1;border-radius:inherit;background:rgb(255 255 255/.03);-webkit-backdrop-filter:url(#lensTile) saturate(1.15);backdrop-filter:url(#lensTile) saturate(1.15);box-shadow:inset 0 1px 0 rgb(255 255 255/.4),inset 0 -6px 10px -6px rgb(0 0 0/.4),inset 0 0 12px rgb(255 255 255/.08)}
.th .flipper{z-index:2}
.th img{width:100%;height:100%;object-fit:contain;display:block;background:transparent}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt small{color:var(--l2);font-size:13px;letter-spacing:0}
.rp{flex:none;margin-left:auto;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#0b0b0d;letter-spacing:0;background:linear-gradient(120deg,var(--c1),var(--c2),var(--c3),var(--c2),var(--c1));background-size:300% 100%;animation:flow 6s linear infinite;white-space:nowrap}
/* переворот фото у края (5px) */
.flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s var(--spring)}.flipper.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden;font-size:24px;color:var(--l3)}
.face.back{transform:rotateY(180deg)}.face img,.face video{width:100%;height:100%;object-fit:cover}.face.back img{transform:scaleX(-1)}
/* профиль предмета */
.gold.ring,.gold.rp{background:linear-gradient(110deg,#6b4300 0%,#ffd34d 22%,#fff6c2 34%,#ffd34d 46%,#7a4f00 70%,#ffd34d 88%,#6b4300 100%);background-size:250% 100%;animation:flow 2.6s linear infinite}
.gold.prof{background:linear-gradient(110deg,#6b4300 0%,#ffd34d 22%,#fff6c2 34%,#ffd34d 46%,#7a4f00 70%,#ffd34d 88%,#6b4300 100%);background-size:250% 100%;animation:flow 2.6s linear infinite,rise .6s var(--spring) both}
.prof{margin:12px 16px 0;padding:3px;border-radius:30px;box-shadow:0 0 26px -6px var(--c2),0 16px 34px -12px rgb(0 0 0/.7);background:linear-gradient(120deg,var(--c1),var(--c2),var(--c3),var(--c2),var(--c1));background-size:300% 100%;animation:flow 7s linear infinite,rise .6s var(--spring) both}
.pin{background:rgb(255 255 255/.03);border-radius:27px;overflow:hidden;position:relative}
.hero{aspect-ratio:1/1;position:relative;background:radial-gradient(circle at 50% 35%,#2c2c2e,#060607);max-height:60vh;width:100%}
.hero .face{font-size:56px}
.ptitle{padding:14px 18px 18px}.ptitle h2{margin:0;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.pmeta{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--l2);font-size:14px}.pmeta .rp{margin-left:0}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}.thumbs::-webkit-scrollbar{display:none}
.thumbs>div{flex:none;width:58px;height:58px;border-radius:14px;overflow:hidden;background:var(--card);cursor:pointer;opacity:.6;position:relative;transition:opacity .3s,transform .49s var(--spring),box-shadow .3s}
.thumbs>div.on{opacity:1;transform:scale(1.06);box-shadow:0 0 0 2px var(--label)}.thumbs img{width:100%;height:100%;object-fit:cover}.thumbs i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;background:#0007}
.sec{margin:14px 16px;padding:14px 16px;background:rgb(255 255 255/.03);box-shadow:var(--gvol-s);border-radius:20px;position:relative;animation:rise .6s var(--spring) both;animation-delay:calc(var(--i,0) * 60ms + 80ms)}
.sec h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--l2)}.sec blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--fill);color:var(--l2)}.sec a{color:#2997ff}.sec p{margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}.grid img,.grid video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#000}
.tools{display:flex;gap:6px;position:absolute;right:10px;top:8px}.tools .grip{touch-action:none;cursor:grab;min-width:40px;letter-spacing:-2px;font-weight:700}
.sec.dragging{animation:none;transform:translateY(var(--dy,0));z-index:5;transition:none;box-shadow:0 18px 40px -10px rgb(0 0 0/.65)}.tools button{min-width:36px;height:32px;border:0;border-radius:999px;background:var(--fill);color:var(--label);font-size:14px}.dim{opacity:.45}
.fbtn{display:block;width:calc(100% - 32px);margin:12px 16px;height:50px;border:0;border-radius:999px;background:var(--fill);color:var(--label);font:inherit;font-weight:600}
.form{padding:10px 16px 120px}.form h2{margin:8px 4px 4px;font-size:28px}label{display:block;margin:14px 6px 6px;color:var(--l2);font-size:13px}
input.f,textarea.f,select.f{width:100%;padding:12px 16px;border:0;border-radius:14px;background:var(--card);color:var(--label);font:inherit;outline:0}textarea.f{min-height:96px;resize:vertical}input.f:focus,textarea.f:focus,select.f:focus{box-shadow:0 0 0 2px var(--accent)}
.hide{display:none!important}.empty{text-align:center;color:var(--l2);padding:48px 20px}.sub{color:var(--l2);font-size:13px}
.swap-f{animation:swapIn .55s var(--spring) both}.swap-b{animation:swapBack .55s var(--spring) both}.in{animation:mat .5s var(--spring) both}
@media (prefers-reduced-transparency:reduce){.glass,.gbtn{background:#2c2c2e;-webkit-backdrop-filter:none;backdrop-filter:none}.edge{-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast:more){.glass,.gbtn{background:#2c2c2e;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 0 0 1px #fff}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="edge"></div>
<div id="home"><h1>Wiki<small>DuoSup • Blox Fruits</small></h1><div class="list" id="list"></div></div>
<div class="glass dock" id="dock">
  <input class="srch" id="q" placeholder="Поиск" autocomplete="off">
  <div class="tabs"><button class="mbtn" id="menu" aria-label="Категории"><i></i><i></i><i></i></button><div class="chips" id="chips"></div></div>
</div>
<div class="sheet hide" id="sheet"><div class="scrim" id="scrim"></div><div class="glass sbox" id="sbox"><div id="sitems"></div></div></div>
<button class="fbtn hide" id="add">＋ Добавить запись</button>
<div id="view" class="hide"></div><div id="form" class="hide"></div>
<script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('#000000');tg.setBackgroundColor('#000000')}catch(e){}
const H={'X-Init-Data':tg.initData};
const RAR={mythical:{n:'Мифический',c:['#6b0f1a','#ff3b5c','#ffd0d8']},permanent:{n:'Permanent',c:['#7a5a00','#f5c542','#fff3b0']},legendary:{n:'Легендарный',c:['#8a1f5a','#ff6ec7','#ffd1ef']},rare:{n:'Эпический',c:['#3b1d7a','#9d5cff','#e3d4ff']},uncommon:{n:'Необычный',c:['#124a80','#3da5ff','#cfe7ff']},common:{n:'Обычный',c:['#3a3a3f','#8e8e93','#e5e5ea']},'':{n:'',c:['#2c2c2e','#6e6e73','#c7c7cc']}};
const ORDER=['permanent','mythical','legendary','rare','uncommon','common',''];
const RANK=Object.fromEntries(ORDER.map((k,i)=>[k,i]));
const num=v=>Number(v)||0;
const fmtPrice=v=>num(v)?' · '+num(v).toLocaleString('ru-RU')+' ₽':'';
const GOLD=['#6b4300','#ffd34d','#fff6c2'];
const isGold=c=>/гемпас|gamepass|game ?pass|драгон|dragon/i.test(c||'');
const gs=(r,cat)=>{const c=isGold(cat)?GOLD:(RAR[r]||RAR['']).c;return `--c1:${c[0]};--c2:${c[1]};--c3:${c[2]}`};
const rp=(r,cat)=>(r&&RAR[r])?`<span class="rp${isGold(cat)?' gold':''}" style="${gs(r,cat)}">${RAR[r].n}</span>`:'';
let DATA=null,CAT='Все',OPEN=null,LAY=null,WL=null,LE=false,E=null,CUR='home',FZ=null;
const $=id=>document.getElementById(id);
const BASE_KEYS=['hero','thumbs','listphoto','order','hide'];
const CP=v=>JSON.parse(JSON.stringify(v));
/* макет категории: свой, если сохранён, иначе общий */
function layFor(cat){const b=LAY||{},o=(b.cats&&b.cats[cat])||{},r={};BASE_KEYS.forEach(k=>r[k]=CP(o[k]!==undefined?o[k]:b[k]));return r}
const api=async(u,o={})=>{const r=await fetch(u,{...o,headers:{...H,...(o.headers||{})}});if(!r.ok){const t=await r.text();throw new Error(r.status==403?(t=='off'?'Вики сейчас выключена':t=='rights'?'Нет прав':'Нет доступа'):t||'Ошибка')}return r.json()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mu=id=>`/api/media/${encodeURIComponent(id)}?d=${encodeURIComponent(tg.initData)}`;
const norm=s=>(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
function face(m,ctl){
 if(!m)return '<div class="face">✦</div><div class="face back"></div>';
 if(m.t!='photo')return `<div class="face"><video src="${mu(m.id)}" ${ctl?'controls':''} playsinline preload="metadata"></video></div><div class="face back"></div>`;
 return `<div class="face"><img src="${mu(m.id)}" loading="lazy"></div><div class="face back"><img src="${mu(m.id)}" loading="lazy"></div>`}
const OK=new Set(['B','I','U','S','CODE','PRE','BLOCKQUOTE','BR','EM','STRONG','A']);
function clean(html){const d=new DOMParser().parseFromString('<div>'+(html||'').replace(/\[\[([^\]|]{1,80})(?:\|([^\]]*))?\]\]/g,(m,t,l)=>`<a data-w="${esc(t)}">${esc(l||t)}</a>`)+'</div>','text/html').body.firstChild;
 (function w(n){[...n.childNodes].forEach(c=>{if(c.nodeType==3)return;if(c.nodeType!=1){c.remove();return}
  if(c.tagName=='TG-EMOJI'){c.replaceWith(document.createTextNode(c.textContent));return}
  if(!OK.has(c.tagName)){w(c);c.replaceWith(...c.childNodes);return}
  const h=c.tagName=='A'?(c.getAttribute('href')||''):'',dw=c.getAttribute('data-w');
  [...c.attributes].forEach(a=>c.removeAttribute(a.name));
  if(c.tagName=='A'){if(dw)c.setAttribute('data-w',dw);else if(/^https?:|^tg:/.test(h)){c.setAttribute('href',h);c.setAttribute('target','_blank')}}
  w(c)})})(d);return d.innerHTML.replace(/\n/g,'<br>')}
function show(v,back){['home','view','form'].forEach(x=>$(x).classList.toggle('hide',x!=v));$('dock').classList.toggle('hide',v!='home');window.scrollTo(0,0);
 if(v!=CUR){const el=$(v);el.classList.remove('swap-f','swap-b');void el.offsetWidth;el.classList.add(back?'swap-b':'swap-f')}CUR=v;
 v=='home'?tg.BackButton.hide():tg.BackButton.show()}
tg.BackButton.onClick(()=>{tg.MainButton.hide();if(!$('form').classList.contains('hide')&&OPEN)openEntry(OPEN,1);else{LE=false;show('home',1)}});
/* ----- категории: капсула переезжает к выбранной ----- */
function movePill(){const on=document.querySelector('#chips .chip.on'),p=$('pill');if(!on||!p)return;p.style.width=on.offsetWidth+'px';p.style.transform=`translateX(${on.offsetLeft}px)`}
function renderTabs(){const cats=['Все',...new Set(DATA.items.map(i=>i.c))];
 $('chips').innerHTML='<span class="pill" id="pill"></span>'+cats.map(c=>`<span class="chip ${c==CAT?'on':''}" data-c="${esc(c)}">${esc(c)}</span>`).join('');
 $('sitems').innerHTML=cats.map(c=>`<div class="si ${c==CAT?'on':''}" data-c="${esc(c)}"><span>${esc(c)}</span><span style="color:var(--l3)">${c=='Все'?DATA.items.length:DATA.items.filter(i=>i.c==c).length}</span></div>`).join('');
 requestAnimationFrame(movePill)}
function setCat(c){CAT=c;document.querySelectorAll('#chips .chip').forEach(x=>x.classList.toggle('on',x.dataset.c==c));document.querySelectorAll('#sitems .si').forEach(x=>x.classList.toggle('on',x.dataset.c==c));movePill();renderList()}
$('chips').onclick=e=>{const c=e.target.closest('.chip');if(c)setCat(c.dataset.c)};
$('menu').onclick=()=>$('sheet').classList.remove('hide');

function renderList(){const q=norm($('q').value);
 const it=DATA.items.filter(i=>(CAT=='Все'||i.c==CAT)&&(!q||norm(i.t).includes(q)||i.a.some(a=>norm(a).includes(q))))
  .sort((a,b)=>((RANK[a.r||'']??6)-(RANK[b.r||'']??6))||(num(b.pr)-num(a.pr))||a.t.localeCompare(b.t,'ru'));
 $('list').innerHTML=it.length?'<div class="grp">'+it.map((i,n)=>`<div class="row" style="--i:${n};${gs(i.r,i.c)}" data-id="${i.id}">`+
  (layFor(i.c).listphoto?`<div class="th"><div class="grad"></div><div class="gl"></div><div class="flipper">${face(i.p?{t:'photo',id:i.p}:null)}</div></div>`:'')+
  `<div class="rt"><b>${esc(i.t)}</b><small>${esc(i.c)}${fmtPrice(i.pr)}</small></div>${rp(i.r,i.c)}</div>`).join('')+'</div>':'<div class="empty">Ничего не найдено</div>'}
function edgeNear(e,box){const r=box.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;return x<=5||y<=5||r.width-x<=5||r.height-y<=5}
function flipZone(e,sel){const z=e.target.closest(sel);if(FZ&&FZ!==z)FZ.querySelector('.flipper')?.classList.remove('flip');
 if(z)z.querySelector('.flipper')?.classList.toggle('flip',edgeNear(e,z));FZ=z}
$('list').addEventListener('pointermove',e=>flipZone(e,'.th'));
$('list').addEventListener('pointerleave',()=>{FZ&&FZ.querySelector('.flipper')?.classList.remove('flip');FZ=null});
$('view').addEventListener('pointermove',e=>flipZone(e,'.hero'));
$('view').addEventListener('pointerleave',()=>{FZ&&FZ.querySelector('.flipper')?.classList.remove('flip');FZ=null});
$('q').oninput=renderList;
$('list').onclick=e=>{const r=e.target.closest('.row');if(r)openEntry(+r.dataset.id)};
/* ----- карточка предмета ----- */
const NAMES={description:'Описание',obtain:'Как получить',stats:'Характеристика',notes:'Примечания',skills:'Скиллы'};
function setHero(i){const m=E.media[i];$('hf').innerHTML=face(m,1);$('hf').classList.remove('flip');document.querySelectorAll('.thumbs>div').forEach((d,k)=>d.classList.toggle('on',k==i))}
function renderEntry(back){const d=E,m0=d.media[0],L=(LE&&WL)?WL:layFor(d.category);let h='';
  if(LE){const others=DATA.cats.filter(c=>c!=d.category);h+=`<div class="glass bar"><div class="sub" style="margin:0 2px 4px">Макет категории «${esc(d.category)}». Двигайте блоки за ⋮⋮</div><label>Большое фото сверху<input type="checkbox" id="l_hero" ${L.hero?'checked':''}></label><label>Миниатюры<input type="checkbox" id="l_thumbs" ${L.thumbs?'checked':''}></label><label>Фото в списке<input type="checkbox" id="l_lp" ${L.listphoto?'checked':''}></label><button class="gbtn pri" id="lsave">Сохранить макет</button><select class="f" id="l_to" style="margin-top:6px"><option value="">Скопировать в категорию…</option>${others.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select><button class="gbtn" id="lcopy">Скопировать макет</button></div>`}
 h+=`<div class="prof${isGold(d.category)?' gold':''}" style="${gs(d.rarity,d.category)}"><div class="pin">`;
 if(L.hero)h+=`<div class="hero"><div class="flipper" id="hf">${face(m0,1)}</div></div>`;
 h+=`<div class="ptitle"><h2>${esc(d.title)}</h2><div class="pmeta"><span>${esc(d.category)}</span>${rp(d.rarity,d.category)}</div></div></div></div>`;
 if(L.hero&&L.thumbs&&d.media.length>1)h+='<div class="thumbs">'+d.media.map((m,i)=>`<div class="${i?'':'on'}" data-i="${i}">${m.t=='photo'?`<img src="${mu(m.id)}" loading="lazy">`:'<i>▶</i>'}</div>`).join('')+'</div>';
 let n=0;L.order.forEach(k=>{const hid=L.hide.includes(k);if(hid&&!LE)return;let body='';
  if(k=='skills'){if(!d.skills.length&&!LE)return;body=d.skills.map(s=>`<p><b>${esc(s.label)}${s.form==2?' · V2':''}</b><br>${clean(s.text)}</p>`+(s.media.length?'<div class="grid">'+s.media.map(m=>m.t=='photo'?`<img src="${mu(m.id)}" loading="lazy">`:`<video src="${mu(m.id)}" controls playsinline preload="metadata"></video>`).join('')+'</div>':'')).join('')}
  else{if(!(d[k]||'').trim()&&!LE)return;body=clean(d[k])}
  h+=`<div class="sec ${hid?'dim':''}" data-k="${k}" style="--i:${n++}"><h3>${NAMES[k]}</h3>${body}${LE?`<div class="tools"><button class="grip" data-m="drag" data-k="${k}">⋮⋮</button><button data-m="eye" data-k="${k}">${hid?'🚫':'👁'}</button></div>`:''}</div>`});
 if(d.edit&&!LE)h+='<div class="glass fab"><button class="gbtn" id="le">Макет</button><button class="gbtn pri" id="ed">Править</button></div>';
 h+='<div style="height:150px"></div>';
 $('view').innerHTML=h;show('view',back);
 if(d.edit){if(LE){$('lsave').onclick=saveLayout;$('lcopy').onclick=copyLayout}else{$('ed').onclick=()=>editForm(d);$('le').onclick=()=>{WL=layFor(d.category);LE=true;renderEntry()}}}}
async function openEntry(id,back){try{E=await api('/api/entry/'+id);OPEN=id;LE=false;renderEntry(back)}catch(e){tg.showAlert(e.message)}}
function readBar(){['hero','thumbs','listphoto'].forEach((nm,j)=>{const c=$(['l_hero','l_thumbs','l_lp'][j]);if(c)WL[nm]=c.checked})}
async function pushLayout(){await api('/api/layout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(LAY)})}
async function saveLayout(){readBar();const cat=E.category;LAY.cats=LAY.cats||{};LAY.cats[cat]=CP(WL);
 try{await pushLayout();LE=false;tg.showAlert('Макет сохранён для «'+cat+'»');renderEntry()}catch(e){tg.showAlert(e.message)}}
async function copyLayout(){readBar();const to=$('l_to').value;if(!to){tg.showAlert('Выберите категорию');return}
 LAY.cats=LAY.cats||{};LAY.cats[to]=CP(WL);
 try{await pushLayout();tg.showAlert('Макет скопирован в «'+to+'»')}catch(e){tg.showAlert(e.message)}}
$('view').onclick=e=>{const t=e.target.closest('.thumbs>div');if(t){setHero(+t.dataset.i);return}
  const b=e.target.closest('.tools button');if(b){const k=b.dataset.k;if(b.dataset.m=='eye'){readBar();WL.hide=WL.hide.includes(k)?WL.hide.filter(x=>x!=k):[...WL.hide,k];renderEntry()}return}
 const a=e.target.closest('a[data-w]');if(a){const k=norm(a.dataset.w);const f=DATA.items.find(i=>norm(i.t)==k||i.a.some(x=>norm(x)==k));if(f)openEntry(f.id)}};
/* ----- перетаскивание блоков макета ----- */
let DG=null;
$('view').addEventListener('pointerdown',e=>{const g=e.target.closest('.tools .grip');if(!g||!LE)return;e.preventDefault();
 const sec=g.closest('.sec'),all=[...$('view').querySelectorAll('.sec[data-k]')];
 DG={k:g.dataset.k,el:sec,y0:e.clientY,all,idx:all.indexOf(sec),to:all.indexOf(sec)};sec.classList.add('dragging');g.setPointerCapture(e.pointerId)});
$('view').addEventListener('pointermove',e=>{if(!DG)return;const dy=e.clientY-DG.y0;DG.el.style.setProperty('--dy',dy+'px');
 const r0=DG.all[DG.idx].getBoundingClientRect(),cy=r0.top+r0.height/2+dy;let t=0;
 DG.all.forEach((x,i)=>{if(i===DG.idx)return;const r=x.getBoundingClientRect();if(r.top+r.height/2<cy)t++});DG.to=t});
const endDrag=()=>{if(!DG)return;const {k,el,to}=DG;DG=null;el.classList.remove('dragging');el.style.removeProperty('--dy');
 const o=WL.order,i=o.indexOf(k);if(i>-1){o.splice(i,1);o.splice(Math.min(to,o.length),0,k)}renderEntry()};
$('view').addEventListener('pointerup',endDrag);$('view').addEventListener('pointercancel',endDrag);
/* ----- редактирование (создатель и редакторы) ----- */
function editForm(d){const n=!d;d=d||{title:'',category:'Другое',aliases:'',description:'',obtain:'',stats:'',notes:'',rarity:''};
 const f=(k,l,t)=>`<label>${l}</label>${t?`<textarea class="f" id="f_${k}">${esc(d[k])}</textarea>`:`<input class="f" id="f_${k}" value="${esc(d[k])}">`}`;
 $('form').innerHTML=`<div class="form"><h2>${n?'Новая запись':'Редактирование'}</h2>${f('title','Название')}
 <label>Категория</label><input class="f" id="f_category" list="cl" value="${esc(d.category)}"><datalist id="cl">${DATA.cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <label>Редкость</label><select class="f" id="f_rarity"><option value="">— не указана</option>${Object.keys(RAR).filter(k=>k).map(k=>`<option value="${k}" ${d.rarity==k?'selected':''}>${RAR[k].n}</option>`).join('')}</select>
 ${f('aliases','Другие названия (через запятую)')}${f('description','Описание',1)}${f('obtain','Как получить',1)}${f('stats','Характеристика',1)}${f('notes','Примечания',1)}
 <p class="sub" style="margin:8px 4px">Теги &lt;b&gt;, &lt;i&gt;, &lt;blockquote&gt; и ссылки [[Название]] на другие записи. Фото и видео добавляются через бота (/wikiedit).</p></div>`;
 show('form');tg.MainButton.setText('Сохранить').show().offClick(save).onClick(save);window.EID=n?null:d.id}
async function save(){const g=k=>$('f_'+k).value;tg.MainButton.showProgress();
 try{const r=await api('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:window.EID,...Object.fromEntries(['title','category','rarity','aliases','description','obtain','stats','notes'].map(k=>[k,g(k)]))})});
  tg.MainButton.hide();await load();openEntry(r.id)}catch(e){tg.showAlert(e.message)}finally{tg.MainButton.hideProgress()}}
$('add').onclick=()=>{OPEN=null;editForm(null)};
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.gbtn');if(!el)return;const r=el.getBoundingClientRect();el.style.setProperty('--px',(e.clientX-r.left)+'px');el.style.setProperty('--py',(e.clientY-r.top)+'px')});
async function load(){try{DATA=await api('/api/list');LAY=DATA.layout;$('add').classList.toggle('hide',!DATA.edit);renderTabs();renderList()}catch(e){$('list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
load();
</script><script>
/* СТЕКЛО: у края пилюли фон «переворачивается» как в закалённом стекле (Chromium / Telegram Android).
   Карта смещения рисуется один раз на элемент (не на каждый кадр) -> без лагов. */
(function(){
 var ua=navigator.userAgent;
 var st;addEventListener('scroll',function(){document.body.classList.add('scr');clearTimeout(st);st=setTimeout(function(){document.body.classList.remove('scr')},140)},{passive:true});
 if(!/Chrome\//.test(ua)||/iPhone|iPad|iPod|CriOS|EdgiOS/.test(ua))return;
 var NS='http://www.w3.org/2000/svg',n=0;
 var svg=document.createElementNS(NS,'svg');svg.setAttribute('width','0');svg.setAttribute('height','0');
 svg.style.cssText='position:absolute;pointer-events:none';
 var defs=document.createElementNS(NS,'defs');svg.appendChild(defs);document.body.appendChild(svg);
 function fill(d,W,H,r,B,MX,S){
  var hw=W/2,hh=H/2;
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){
   var px=x+.5-hw,py=y+.5-hh,sx=px<0?-1:1,sy=py<0?-1:1;
   var qx=Math.abs(px)-(hw-r),qy=Math.abs(py)-(hh-r),ox,oy,sd;
   if(qx>0&&qy>0){var l=Math.hypot(qx,qy)||1;ox=sx*qx/l;oy=sy*qy/l;sd=l-r}
   else if(qx>qy){ox=sx;oy=0;sd=qx-r}else{ox=0;oy=sy;sd=qy-r}
   var dep=-sd,dx=0,dy=0;
   if(dep<B){var t=Math.max(0,dep)/B,m=MX*(1-t)*(1-t);dx=-ox*m;dy=-oy*m}
   var i=(y*W+x)*4;
   d[i]=Math.round(127.5+dx/S*255);d[i+1]=Math.round(127.5+dy/S*255);d[i+2]=0;d[i+3]=255;
  }
 }
 function build(el){
  var W=Math.round(el.offsetWidth),H=Math.round(el.offsetHeight);
  if(W<12||H<12)return;
  var r=Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius)||0,W/2,H/2);
  var B=Math.min(16,Math.min(W,H)/3),MX=B*1.7,S=MX*2;
  var c=document.createElement('canvas');c.width=W;c.height=H;
  var g=c.getContext('2d'),im=g.createImageData(W,H);fill(im.data,W,H,r,B,MX,S);g.putImageData(im,0,0);
  var id=el._lens||(el._lens='lens'+(++n)),old=document.getElementById(id);if(old)old.remove();
  defs.insertAdjacentHTML('beforeend','<filter id="'+id+'" x="0" y="0" width="'+W+'" height="'+H+'" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feImage href="'+c.toDataURL()+'" x="0" y="0" width="'+W+'" height="'+H+'" preserveAspectRatio="none" result="map"/><feDisplacementMap in="SourceGraphic" in2="map" scale="'+S.toFixed(1)+'" xChannelSelector="R" yChannelSelector="G"/></filter>');
  var v='url(#'+id+') saturate(1.15)';el.style.backdropFilter=v;el.style.webkitBackdropFilter=v;
 }
 function tileLens(){var W=54,H=54,c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d'),im=g.createImageData(W,H);fill(im.data,W,H,14,10,6,12);g.putImageData(im,0,0);
  defs.insertAdjacentHTML('beforeend','<filter id="lensTile" x="0" y="0" width="54" height="54" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feImage href="'+c.toDataURL()+'" x="0" y="0" width="54" height="54" preserveAspectRatio="none" result="map"/><feDisplacementMap in="SourceGraphic" in2="map" scale="12" xChannelSelector="R" yChannelSelector="G"/></filter>')}
tileLens();
var q=new Set(),raf=0;
 var ro=new ResizeObserver(function(l){l.forEach(function(e){q.add(e.target)});
  if(!raf)raf=requestAnimationFrame(function(){raf=0;var o=Array.from(q);q.clear();o.forEach(build)})});
 var SEL='.dock,.bar,.gbtn';
 function scan(root){
  if(!root.querySelectorAll)return;
  var list=[].slice.call(root.querySelectorAll(SEL));
  if(root.matches&&root.matches(SEL))list.push(root);
  list.forEach(function(el){
   if(el.classList.contains('gbtn')&&el.parentElement&&el.parentElement.closest('.glass:not(.fab)'))return;
   if(el._lo)return;el._lo=1;ro.observe(el);
  });
 }
 scan(document.body);
 new MutationObserver(function(m){m.forEach(function(r){r.addedNodes.forEach(scan)})}).observe(document.body,{childList:true,subtree:true});
})();
</script>
